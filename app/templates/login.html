{% extends "base.html" %}
{% block content %}
  <section class="row justify-content-center py-5">
    <article class="col-12 col-md-8 col-lg-6 col-xl-5 col-hd-4">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-lg-5">
          <h1 class="h3 mb-3">Sign In</h1>
          <p class="text-body-secondary mb-4">Your login stays active for the browser session and is cleared when the session ends or you sign out.</p>
          <form method="post" action="{{ url_for('login') }}">
          {% if next_target %}
            <input type="hidden" name="next" value="{{ next_target }}">
          {% endif %}
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input class="form-control" id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Sign In</button>
          </form>
        </div>
      </div>
    </article>
  </section>
{% endblock %}
